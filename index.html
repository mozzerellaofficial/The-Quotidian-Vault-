        let particles = [];
        
        let width = window.innerWidth;
        let height = window.innerHeight;

        canvas.height = height;

        let mouse = { x: -1000, y: -1000 };
        let lastMouse = { x: -1000, y: -1000 };
        
        const handleMouseMove = (e) => { mouse.x = e.clientX; mouse.y = e.clientY; };
        const handleMouseLeave = () => { mouse.x = -1000; mouse.y = -1000; lastMouse.x = -1000; lastMouse.y = -1000; };

        window.addEventListener('mousemove', handleMouseMove);
        window.addEventListener('mouseleave', handleMouseLeave);
        window.addEventListener('resize', () => {
          width = window.innerWidth;
          height = window.innerHeight;
          canvas.width = width;
          canvas.height = height;
        });

        const fontSize = 16;
        const columns = Math.floor(width / fontSize) + 2; 
        const rows = Math.floor(height / fontSize) + 2;
        
        for (let y = 0; y < rows; y++) {
          for (let x = 0; x < columns; x++) {
            particles.push({
              index: particles.length,
              baseX: x * fontSize,
              baseY: y * fontSize,
              x: x * fontSize,
              y: y * fontSize,
              vx: 0,
              vy: 0,
              char: Math.random() > 0.5 ? '1' : '0',

              const eOut = Math.min(1, Math.max(0, (W - 1.2) / 0.5));
              explorerTextRef.current.style.opacity = eIn * (1 - eOut);
              explorerTextRef.current.style.transform = `scale(${0.9 + (eIn * 0.1)}) translateY(${-(eOut * 50)}px)`;
              explorerTextRef.current.style.filter = `blur(${(1 - eIn) * 10}px)`;
          }

          // --- CSS Theme Light/Dark Mode Math ---
          // Light mode dynamically inverts variables as the wave travels
          // --- DOM Sync: Download Typewriter & Box ---
          if (downloadTextRef.current) {
              const dProg = Math.min(1, Math.max(0, (S_norm - 10.2) / 0.4));
              const dText = "Secure. Portable. Yours.";
              const chars = Math.floor(dProg * dText.length);
              downloadTextRef.current.innerText = dText.substring(0, chars);
              
              let boxInFade = Math.min(1, Math.max(0, (S_norm - 10.5) / 0.5));
              downloadTextRef.current.style.opacity = 1 - boxInFade;
              downloadTextRef.current.style.transform = `translateY(${-(boxInFade * 50)}px)`;
          }

          let boxIn = 0;
          if (downloadBoxRef.current) {
              boxIn = Math.min(1, Math.max(0, (S_norm - 10.5) / 0.5));
              downloadBoxRef.current.style.opacity = boxIn;
              downloadBoxRef.current.style.transform = `translateY(calc(-50% + ${50 - boxIn * 50}px))`;
              downloadBoxRef.current.style.pointerEvents = boxIn > 0.8 ? 'auto' : 'none';
          }

          // Light mode dynamically inverts variables
          let lightMode = 0;
          if (S_norm >= 0.5 && S_norm < 1.0) {
              lightMode = (S_norm - 0.5) / 0.5;
          } else if (S_norm >= 1.0 && S_norm < 1.5) {
              lightMode = 1.0;
          } else if (S_norm >= 1.5 && S_norm < 2.0) {
              lightMode = 1.0 - ((S_norm - 1.5) / 0.5);
          } else if (S_norm >= 6.5 && S_norm < 7.0) {
              lightMode = Math.min(1, Math.max(0, (S_norm - 6.5) / 0.5));
          } else if (S_norm >= 7.0 && S_norm < 8.5) {
              lightMode = 1.0;
          } else if (S_norm >= 8.5 && S_norm < 9.0) {
              lightMode = 1.0 - ((S_norm - 8.5) / 0.5);
          } else {
              lightMode = 0;
          }
          
          const textMain = lerpColor(224, 20, lightMode);
          document.documentElement.style.setProperty('--text-main', `rgb(${textMain}, ${textMain}, ${textMain})`);
          
          const textDim = lerpColor(136, 100, lightMode);
          document.documentElement.style.setProperty('--text-dim', `rgb(${textDim}, ${textDim}, ${textDim})`);
          
          const glassRGB = lerpColor(10, 252, lightMode);
          document.documentElement.style.setProperty('--glass-bg', `rgba(${glassRGB}, ${glassRGB}, ${glassRGB}, 0.7)`);
          
          const borderRGB = lerpColor(255, 0, lightMode);
          document.documentElement.style.setProperty('--card-border', `rgba(${borderRGB}, ${borderRGB}, ${borderRGB}, ${0.05 + (lightMode*0.1)})`);
          
          const cardBgRGB = lerpColor(25, 255, lightMode);
          document.documentElement.style.setProperty('--card-bg', `rgba(${cardBgRGB}, ${cardBgRGB}, ${cardBgRGB}, 0.4)`);

          const accent = lerpColor(255, 0, lightMode);
          document.documentElement.style.setProperty('--accent-color', `rgb(${accent}, ${accent}, ${accent})`);
          
          const btnText = lerpColor(0, 255, lightMode);
          document.documentElement.style.setProperty('--primary-btn-text', `rgb(${btnText}, ${btnText}, ${btnText})`);

          document.documentElement.style.setProperty('--logo-invert', 1 - lightMode);

          // Background fill 
          const bgVal = lerpColor(3, 250, lightMode); 
          ctx.fillStyle = `rgb(${bgVal}, ${bgVal}, ${bgVal})`;
          ctx.fillRect(0, 0, width, height);

          // Wave Physics Variables
          const waveProgress = Math.min(1, Math.max(0, W / 1.0)); 
          const maxWaveRadius = Math.sqrt(width * width + height * height);
          const currentWaveRadius = waveProgress * maxWaveRadius * 1.5;

          // Base Particle Coloring
          let baseParticleRgb = 120;
          if (S_norm < 0.5) baseParticleRgb = 120 + (135 * (S_norm/0.5)); 
          else if (S_norm >= 0.5 && S_norm <= 1.0) baseParticleRgb = 255 - (255 * ((S_norm-0.5)/0.5));
          if (C > 0 && C < 1.0) baseParticleRgb = 0 + (150 * C); 
          else if (C >= 1.0) baseParticleRgb = 150; 
          
          // Switch particle base for light mode
          baseParticleRgb = lerpColor(baseParticleRgb, 80, lightMode);

          const activeColor = `rgb(${baseParticleRgb}, ${baseParticleRgb}, ${baseParticleRgb})`;
          const idleColor = `rgba(${Math.max(0, baseParticleRgb - 40)}, ${Math.max(0, baseParticleRgb - 40)}, ${Math.max(0, baseParticleRgb - 40)}, 1)`;

          // --- Physics Engine Execution ---
          let lockCenterY = height / 2;
          let lockCenterX = width / 2;
          if (width > 768) lockCenterX -= textInProgress * (width * 0.25); 

          let mouseVx = 0; let mouseVy = 0;
          if (lastMouse.x > -100 && mouse.x > -100) { mouseVx = mouse.x - lastMouse.x; mouseVy = mouse.y - lastMouse.y; }
          lastMouse.x = mouse.x; lastMouse.y = mouse.y;

          ctx.font = `${fontSize}px monospace`;
          
          const spiralProgress = Math.min(1, Math.max(0, (C - 0.3) / 0.5));
          const lockProgress = Math.min(1, Math.max(0, (C - 0.6) / 0.5));
          const blowupProgress = Math.min(1, Math.max(0, (C - 1.8) / 0.3));
          const regridProgress = Math.min(1, Math.max(0, (C - 2.0) / 0.4));
          const dlAnimProgress = Math.min(1, Math.max(0, (S_norm - 9.8) / 0.8)); // 9.8 to 10.6

          const sequenceActive = (C > 0 && regridProgress < 1) || dlAnimProgress > 0;
          const currentSpring = 0.03 + (0.07 * (sequenceActive ? 1 : 0)); 
          const currentFriction = 0.92 - (0.15 * (sequenceActive ? 1 : 0));

          particles.forEach((p) => {
            let targetX = p.baseX;
            let targetY = p.baseY;
            let overrideAlpha = null;
            let overrideFill = null;

            // Phase A: The Padlock Sequence
            if (sequenceActive) {
              if (vacuumProgress > 0 && spiralProgress === 0) {
                 const nx = 1 - (p.baseX / width); 
                 let pProgress = vacuumProgress * 1.5 - (nx * 0.5); 
                 pProgress = Math.min(1, Math.max(0, pProgress));
                 const easeInCubic = Math.pow(pProgress, 3);
                 targetX += easeInCubic * (width + 800); 
              }

              if (spiralProgress > 0) {
                const theta = p.index * GOLDEN_ANGLE + (time * (3 + spiralProgress * 10)); 
                const spiralRadius = Math.sqrt(p.index) * 12;
                const spiralOriginX = (width + 600) - (spiralProgress * (width/2 + 600 - lockCenterX));
                
                const spiralX = spiralOriginX + Math.cos(theta) * spiralRadius;
                const spiralY = lockCenterY + Math.sin(theta) * spiralRadius;

                let pX = lockCenterX;
                let pY = lockCenterY;
                const lockWidth = 120; 
                const lockHeight = 90; 
                
                if (p.h1 < 0.6) { 
                    pX += (p.h2 - 0.5) * lockWidth;
                    pY += ((p.h1 / 0.6) - 0.5) * lockHeight + lockHeight/2;
                    const distToKeyhole = Math.sqrt(Math.pow(pX - lockCenterX, 2) + Math.pow(pY - (lockCenterY + lockHeight/2), 2));
                    if (distToKeyhole < 18) pY += 30; 
                } else { 
                    const arcTheta = Math.PI + (p.h2 * Math.PI); 
                    const arcR = 35 + ((p.h1 - 0.6) / 0.4) * 15; 
                    pX += Math.cos(arcTheta) * arcR;
                    pY += Math.sin(arcTheta) * arcR;
                }

                if (lockProgress === 0) {
                   targetX = lerp(targetX, spiralX, spiralProgress);
                   targetY = lerp(targetY, spiralY, spiralProgress);
                } else {
                   if (p.index < 1200) { 
                      targetX = lerp(spiralX, pX, lockProgress);
                      targetY = lerp(spiralY, pY, lockProgress);
                      overrideAlpha = 0.85;
                   } else {
                      const blowOutAngle = p.h1 * Math.PI * 2;
                      targetX = spiralX + Math.cos(blowOutAngle) * 800;
                      targetY = spiralY + Math.sin(blowOutAngle) * 800;
                      overrideAlpha = Math.max(0, 1 - (lockProgress * 1.5));
                   }
                }

                if (blowupProgress > 0) {
                    const explodeAngle = Math.atan2(targetY - lockCenterY, targetX - lockCenterX);
                    const explodeDist = 2000 * blowupProgress;
                    let explodedX = targetX + Math.cos(explodeAngle) * explodeDist;
                    let explodedY = targetY + Math.sin(explodeAngle) * explodeDist;

                    if (overrideAlpha !== null) overrideAlpha = lerp(overrideAlpha, 0.08, blowupProgress);
                    targetX = lerp(explodedX, p.baseX, regridProgress);
                    targetY = lerp(explodedY, p.baseY, regridProgress);
                }
              }
            }

            // Phase B: The White Wave Inversion
            let distToCenter = 0;
            if (waveProgress > 0 && waveProgress < 1) {
               distToCenter = Math.hypot(p.baseX - width/2, p.baseY - height/2);
               const distToWave = Math.abs(distToCenter - currentWaveRadius);
               
               // If particle is caught inside the wave impact front
               if (distToWave < 200) {
                   const intensity = 1 - (distToWave / 200);
                   overrideAlpha = Math.max(0.1, intensity);
                   // Flip char violently during wave
                   if (Math.random() > 0.8) p.char = p.char === '1' ? '0' : '1';
                   
                   // Color interpolation to bright white during wave impact
                   const wR = lerpColor(baseParticleRgb, 255, intensity);
                   const wG = lerpColor(baseParticleRgb, 255, intensity);
                   const wB = lerpColor(baseParticleRgb, 255, intensity);
                   overrideFill = `rgb(${wR}, ${wG}, ${wB})`;
                   
                   // Lift particle slightly on Y axis based on wave power
                   targetY -= intensity * 30;
               }
            }

            // Phase C: Download Icon Particle Pattern
            let forceFlip = false;
            if (dlAnimProgress > 0) {
                let pX = width/2; let pY = height/2;
                const type = p.index % 3;

                if (type === 0) { 
                    pX = width/2 + (p.h1 - 0.5) * 10;
                    pY = height/2 - 80 + (p.h2 * 100);
                } else if (type === 1) { 
                    const spread = p.h1 * 50;
                    pX = width/2 + (p.h2 > 0.5 ? spread : -spread);
                    pY = height/2 + 20 - spread;
                } else { 
                    if (p.h1 < 0.2) { 
                        pX = width/2 - 60; pY = height/2 + 40 + (p.h2 * 30);
                    } else if (p.h1 > 0.8) { 
                        pX = width/2 + 60; pY = height/2 + 40 + (p.h2 * 30);
                    } else { 
                        pX = width/2 - 60 + ((p.h1 - 0.2)/0.6) * 120; pY = height/2 + 70;
                    }
                }
                targetX = lerp(p.baseX, pX, dlAnimProgress);
                targetY = lerp(p.baseY, pY, dlAnimProgress);
                overrideFill = `rgba(255, 255, 255, ${dlAnimProgress * (1 - boxIn)})`;
                overrideAlpha = Math.max(0, (dlAnimProgress * 0.8) * (1 - boxIn));
            }

            // Idle Ocean Breathing applies normally
            if (!sequenceActive) {
              const breathX = Math.cos(time + p.baseY * 0.02) * 3;
              const breathY = Math.sin(time + p.baseX * 0.02) * 3;
              targetX += breathX; targetY += breathY;
            }

            p.vx += (targetX - p.x) * currentSpring;
            p.vy += (targetY - p.y) * currentSpring;
            
            // Mouse Interaction
            if (mouse.x > -100 && C < 0.1 && lightMode === 0) { 
              const dx = mouse.x - p.x; const dy = mouse.y - p.y;
              const distance = Math.sqrt(dx * dx + dy * dy);
              if (distance < REPULSION_RADIUS) {
                const force = (REPULSION_RADIUS - distance) / REPULSION_RADIUS;
                p.vx -= (dx / distance) * force * 2;
                p.vy -= (dy / distance) * force * 2;
                p.vx += mouseVx * force * 0.1;
                p.vy += mouseVy * force * 0.1;
              }
            }

            p.vx *= currentFriction; p.vy *= currentFriction;
            p.x += p.vx; p.y += p.vy;
            
            const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
            
            let glitch = 0;
            if (S_norm < 0.5) glitch = S_norm / 0.5;
            else if (S_norm >= 0.5 && S_norm < 1.0) glitch = 1 - ((S_norm - 0.5) / 0.5);
            else if (C > 0 && C < 0.7) glitch = spiralProgress * 2;

            const glitchX = (Math.random() - 0.5) * (glitch * 15);
            const glitchY = (Math.random() - 0.5) * (glitch * 15);

            if (overrideFill) {
                ctx.fillStyle = overrideFill;
            } else {
                ctx.fillStyle = speed > 1.0 || glitch > 0.3 ? activeColor : idleColor;
            }
            
            let finalAlpha = overrideAlpha !== null ? overrideAlpha : Math.min(0.06 + (speed * 0.12) + (glitch * 0.5), 1.0);
            
            // Reduce alpha when in light mode to prevent visual clutter
            if (lightMode > 0 && overrideAlpha === null) {
                finalAlpha = lerp(finalAlpha, 0.03, lightMode); 
            }
            
            if (finalAlpha > 0) {
              ctx.globalAlpha = finalAlpha;
              let flipThreshold = 0.98 - (glitch * 0.6); 
              if (speed > 2.0 || forceFlip) flipThreshold = 0.3; // Flipping extremely fast during wave/glitch
              if (Math.random() > flipThreshold) p.char = p.char === '1' ? '0' : '1';

              if (p.x > -20 && p.x < width + 20 && p.y > -20 && p.y < height + 20) {
                ctx.fillText(p.char, p.x + glitchX, p.y + glitchY);
              }
            }
            
            ctx.globalAlpha = 1.0;
          });

          animationFrameId = requestAnimationFrame(render);
        };

        render();

        return () => {
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('mouseleave', handleMouseLeave);
          window.removeEventListener('resize', () => {});
          cancelAnimationFrame(animationFrameId);
        };
      }, []);

      const handleScroll = (e) => {
        const scrollTop = e.target.scrollTop;
        const vh = window.innerHeight;
        
        scrollState.current.target = scrollTop / vh; 
        
        const S = scrollState.current.target;
        if (S < 0.5) setActiveTab('home');
        else if (S < 3.5) setActiveTab('home'); 
        else if (S < 8.5) setActiveTab('features'); 
        else if (S < 11.5) setActiveTab('download');
        else setActiveTab('updates');
      };

      const scrollToSection = (ref, tabName) => {
        if (ref.current) { ref.current.scrollIntoView({ behavior: 'smooth' }); setActiveTab(tabName); }
      };

      return (
        <div>
          <canvas ref={canvasRef} className="binary-canvas" />

          <div className="scroll-container" onScroll={handleScroll} ref={scrollRef}>
            
            {/* 0. Splash (100vh) */}
            <section className="section splash-section">
              <div className="splash-content">
                <GridIcon />
                <h1 className="splash-title">The Quotidian Vault</h1>
                <div className="splash-subtitle">By The Mozzerella Company</div>
              </div>
              <div className="scroll-indicator">
                <span>Scroll</span>
                <ArrowDownIcon />
              </div>
            </section>

            <div className="content-wrapper">
              
              <nav className="navbar" style={{ justifyContent: 'space-between', padding: '0 40px', flexWrap: 'nowrap' }}>
                 <div style={{ display: 'flex', gap: '12px', flex: 1, minWidth: '0', alignItems: 'center' }}>
                   <img src="icon.png" alt="Quotidian Vault Logo" style={{ height: '32px', width: '32px', borderRadius: '6px', filter: 'brightness(0) invert(var(--logo-invert, 1))', transition: 'filter 0.1s' }} />
                   <span style={{ fontWeight: 700, letterSpacing: '0.02em', color: 'var(--text-main)', fontSize: '1.05rem', whiteSpace: 'nowrap' }}>Quotidian Vault</span>
                 </div>
                 <div style={{ display: 'flex', gap: '40px', justifyContent: 'center' }}>
                   <button className={`nav-item ${activeTab === 'home' ? 'active' : ''}`} onClick={() => scrollToSection(homeRef, 'home')}>Home</button>
                   <button className={`nav-item ${activeTab === 'features' ? 'active' : ''}`} onClick={() => scrollToSection(featuresRef, 'features')}>Features</button>
                   <button className={`nav-item ${activeTab === 'download' ? 'active' : ''}`} onClick={() => scrollToSection(downloadRef, 'download')}>Download</button>
                   <button className={`nav-item ${activeTab === 'updates' ? 'active' : ''}`} onClick={() => scrollToSection(updatesRef, 'updates')}>Updates</button>
                 </div>
                 <div style={{ display: 'flex', gap: '20px', flex: 1, justifyContent: 'flex-end', whiteSpace: 'nowrap', minWidth: '0' }}>
                   <button className="nav-item" onClick={() => setShowTutorial(true)}>Tutorial</button>
                   <button className="nav-item" onClick={() => setShowTerms(true)}>Terms & Conditions</button>
                 </div>
               </nav>

              {/* 1. Cinematic Track (300vh) */}
              <section className="section cinematic-section" ref={homeRef} style={{ height: '300vh', display: 'block', padding: 0 }}>
                <div className="sticky-timeline">
                    <div className="page-content" ref={heroDOMRef} style={{ position: 'absolute', width: '100%', maxWidth: '1100px' }}>
                      <div className="split-layout">
                        <div className="text-column">
                          <h2 className="huge-title">A Vault Reimagined.</h2>
                          <p className="huge-subtitle">Absolute security meets fluid, modern design. Built for stealth, optimized for portability, and designed to leave zero traces.</p>
                        </div>
                        <div className="visual-container">
                          <AbstractVaultVisual />
                        </div>
                      </div>
                    </div>

                    <div className="security-impact-layout" ref={securityTextRef}>
                      <h2 className="security-title">Military-Grade Isolation.</h2>
                      <p className="security-desc">
                        Forged with the robust .7z archiving engine, The Quotidian Vault leverages pure AES-256 encryption to completely seal your files. Your data is compressed into a cryptographic black hole—structurally impenetrable and mathematically impossible to breach without your precise credentials.
                      </p>
                    </div>
                </div>
                <div className="snap-page"></div>
                <div className="snap-page"></div>
              </section>

              {/* 2. Scroll-Animated Features (300vh) Left Aligned */}
              <section className="section features-section" ref={featuresRef} style={{ height: '300vh', display: 'block', padding: 0 }}>
                <div className="sticky-timeline">
                  {/* Positioned Left instead of Right */}
                  <div style={{ position: 'absolute', left: '10%', width: '40%', maxWidth: '500px', display: 'flex', flexDirection: 'column', justifyContent: 'center', height: '100%' }}>
                    
                    {/* Feature 1 */}
                    <div className="feature-presentation-box" ref={feature1Ref}>
                      <ShieldIcon />
                      <h2 className="security-title" style={{ fontSize: '2.5rem' }}>High-Security & Recovery</h2>
                      <p className="security-desc">
                        Generate cryptographically secure Recovery Codes exported directly to a safe PDF. Your ultimate backup for critical authentication.
                      </p>
                    </div>

                    {/* Feature 2 */}
                    <div className="feature-presentation-box" ref={feature2Ref} style={{ opacity: 0 }}>
                      <GhostIcon />
                      <h2 className="security-title" style={{ fontSize: '2.5rem' }}>Zero-Trace Portability</h2>
                      <p className="security-desc">
                        Run directly from a portable drive. The moment you lock the vault or eject the drive, the software instantly scrubs and deletes all temporary files, leaving no trace.
                      </p>
                    </div>

                  </div>
                  {/* Right Column for Image */}
                  <div style={{ position: 'absolute', right: '10%', top: '50%', transform: 'translateY(-50%)', width: '40%', display: 'flex', justifyContent: 'center' }}>
                     <img src="Screenshot%202026-07-23%20125334.png" alt="Create Your Vault" ref={featureImageRef} style={{ width: '100%', borderRadius: '12px', boxShadow: '0 20px 40px rgba(0,0,0,0.5)', maxWidth: '400px' }} />
                  </div>
                </div>
                <div className="snap-page"></div>
                <div className="snap-page"></div>
              </section>

              {/* 3. Wave Transition to Custom Vault Explorer (200vh) */}
              <section className="section explorer-section" style={{ height: '200vh', display: 'block', padding: 0 }}>
                 <div className="sticky-timeline" style={{ pointerEvents: 'none' }}>
                    <div ref={explorerTextRef} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', textAlign: 'center', maxWidth: '800px', opacity: 0, padding: '0 40px' }}>
                       <FolderIcon />
                       <h2 className="security-title" style={{ fontSize: '3.5rem', marginBottom: '24px' }}>Custom Vault Explorer</h2>
                       <p className="security-desc" style={{ fontSize: '1.25rem' }}>
                          A beautiful, natively rendered view of your hidden files. Featuring drag-and-drop encryption, virtual folders, and Smart Views (Docs, Audio, Video). Managing encrypted files shouldn't feel like using a terminal.
                       </p>
                       <img src="Screenshot 2026-07-23 121432.png" alt="Custom Vault Explorer Interface" className="explorer-image" style={{ width: '100%', borderRadius: '12px', boxShadow: '0 20px 40px rgba(0,0,0,0.5)', marginTop: '40px' }} />
                    </div>
                 </div>
                 <div className="snap-page"></div>
              </section>

              {/* 4. Additional Operations (100vh) */}
              <section className="section" ref={additionalRef}>
                <div className="page-content">
                  <h2 className="section-title">Additional Operations</h2>
                  <div className="features-grid">
                    <div className="feature-card">
                      <AlertIcon />
                      <h3 className="feature-title">The Danger Zone</h3>
                      <p className="security-desc" style={{ fontSize: '0.95rem' }}>Permanent actions like full decryption or vault deletion are heavily guarded. Requires both your password and a unique Recovery Code to proceed.</p>
                    </div>
                    <div className="feature-card">
                      <FolderIcon />
                      <h3 className="feature-title">Smart Organization</h3>
                      <p className="security-desc" style={{ fontSize: '0.95rem' }}>Bypass raw archive structures. Access virtual folders and instant file sorting, powered directly in memory.</p>
                    </div>
                    <div className="feature-card">
                      <SearchIcon />
                      <h3 className="feature-title">Auto-Scan Detection</h3>
                      <p className="security-desc" style={{ fontSize: '0.95rem' }}>Never lose track of your hidden vaults. Built-in auto-scanners detect hidden .7z vaults on USB drives and present them seamlessly.</p>
                    </div>
                    <div className="feature-card">
                      <svg className="svg-icon feature-icon" viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
                      <h3 className="feature-title">Inactivity Safety Timeout</h3>
                      <p className="security-desc" style={{ fontSize: '0.95rem' }}>Leave your desk without worry. Detects 5 minutes of inactivity to automatically trigger an emergency lock, purging files and securing the vault.</p>
                    </div>
                  </div>
                </div>
              </section>

              {/* 5. Download Animation Track (200vh) */}
              <section className="section download-section" ref={downloadRef} style={{ height: '200vh', display: 'block', padding: 0 }}>
                 <div className="sticky-timeline" style={{ flexDirection: 'column' }}>
                    <h1 ref={downloadTextRef} style={{ position: 'absolute', top: '25%', fontSize: 'clamp(2.5rem, 6vw, 4rem)', fontWeight: '800', color: 'var(--text-main)', margin: 0, letterSpacing: '-0.03em', textAlign: 'center' }}></h1>
                    
                    <div ref={downloadBoxRef} style={{ opacity: 0, position: 'absolute', top: '50%', transform: 'translateY(-50%)', width: '100%', display: 'flex', justifyContent: 'center', padding: '0 20px', zIndex: 100 }}>
                      <div className="download-box" style={{ background: 'var(--card-bg)', border: '1px solid var(--card-border)' }}>
                        <h2 className="section-title" style={{marginBottom: '8px', color: 'var(--text-main)'}}>Get The Vault</h2>
                        <p style={{color: 'var(--text-dim)', marginBottom: '40px'}}>Version 1.0.0 Beta • Windows 10/11 (64-bit)</p>
                        
                        <button onClick={() => setShowDownloadModal(true)} className="btn-primary" style={{ display: 'inline-flex', textDecoration: 'none', fontFamily: 'inherit', border: '1px solid rgba(150,150,150,0.2)' }}>
                          <DownloadIcon /> Download for Windows
                        </button>

                  <h3 style={{ color: 'var(--text-main)', fontSize: '1.5rem', marginTop: '32px', marginBottom: '16px' }}>1. Getting Started: The Startup Screen</h3>
                  <p>When you first open the application, you are greeted by the Startup Screen. Here you have three main options:</p>
                  <ul style={{ paddingLeft: '24px', marginBottom: '24px', display: 'flex', flexDirection: 'column', gap: '12px' }}>
                    <li><strong>[+] ENCRYPT NEW FILE (Create a New Vault):</strong> Use this to create a brand new encrypted vault. You will choose where to save the vault file (e.g., on your PC or a USB drive), create a Master Password, and set a unique Secret Code.</li>
                    <li><strong>[_] OPEN EXISTING VAULT:</strong> If you already have a .7z vault file, click this to manually locate it on your computer and unlock it.</li>
                    <li><strong>[O] AUTO-SCAN FOLDER FOR HIDDEN VAULT:</strong> If you forgot where you saved your vault on a specific drive, select the drive, and the app will scan it to find your hidden vault automatically.</li>

                    <strong style={{ color: '#ff4444', display: 'block', marginBottom: '8px' }}>WARNING: Do Not Lose Your Credentials!</strong>
                    The Quotidian Vault uses dual-factor AES-256 encryption. There are NO backdoors and NO "Forgot Password" buttons. If you lose your Master Password or your Secret Code, your data is permanently lost.
                  </div>

                  <h3 style={{ color: 'var(--text-main)', fontSize: '1.5rem', marginTop: '32px', marginBottom: '16px' }}>2. Navigating the Vault Explorer</h3>
                  <p>Once you unlock your vault, you enter the Vault Explorer. This is your secure workspace.</p>
                  
                  <strong style={{ display: 'block', marginTop: '16px', marginBottom: '8px', color: 'var(--text-main)' }}>The Sidebar (Left Menu)</strong>

                    <li><strong>Safe Mode Toggle:</strong> A switch located at the bottom of the sidebar. You can toggle between "Standard Mode" (Full Access) and "Safe Mode" (Read-Only). (See Section 4 for details).</li>
                    <li><strong>Danger Zone Toggle (The Eye Icon):</strong> Clicking the eye icon at the bottom of the sidebar reveals advanced, destructive options. (See Section 6 for details).</li>

                  <strong style={{ display: 'block', marginTop: '16px', marginBottom: '8px', color: 'var(--text-main)' }}>The Top Toolbar</strong>

                  <h3 style={{ color: 'var(--text-main)', fontSize: '1.5rem', marginTop: '32px', marginBottom: '16px' }}>3. Managing Your Files (Standard Mode)</h3>
                  <p>When you are in Standard Mode, you have full control over your files.</p>
                  <ul style={{ paddingLeft: '24px', marginBottom: '24px', display: 'flex', flexDirection: 'column', gap: '12px' }}>

                    <li><strong>Adding Files (The [+] Button):</strong> Click the large "+" icon in the main grid to browse your computer and select files to encrypt.</li>
                    <li><strong>Creating Folders:</strong> Click the "Folder+" icon to create a new folder to organize your files.</li>
                    <li><strong>Viewing & Editing Files:</strong> Double-click any file to open it. The app securely and temporarily extracts the file so you can view or edit it. Any changes you make and save will automatically sync back into the encrypted vault!</li>
                    <li><strong>Extracting Files (Exporting):</strong> Right-click (or click the three dots on) a file/folder and select Extract. This allows you to save a decrypted copy of the file back to your regular computer.</li>
                    <li><strong>Renaming & Deleting:</strong> Right-click any file or folder to rename it or permanently delete it from the vault.</li>
                  </ul>

                  <h3 style={{ color: 'var(--text-main)', fontSize: '1.5rem', marginTop: '32px', marginBottom: '16px' }}>4. Safe Mode (Read-Only)</h3>
                  <p>Safe Mode is designed for when you need to open your vault on a public or untrusted computer (like a library or a shared office PC).</p>
                  <ul style={{ paddingLeft: '24px', marginBottom: '24px', display: 'flex', flexDirection: 'column', gap: '12px' }}>
                    <li><strong>What it does:</strong> It completely locks down the vault. You cannot add, edit, rename, or delete files while in Safe Mode.</li>
                    <li><strong>Secure Extraction:</strong> If you need to extract a file to the computer while in Safe Mode, the Extract button will initially be greyed out.</li>
                    <li><strong>Unlocking Extraction:</strong> To extract a file, you must click the "Allow Extraction" button and re-enter your Master Password and Secret Code. This grants a 15-minute window where extraction is allowed. After 15 minutes, the app locks down again. This prevents someone from stealing your files if you walk away from the computer.</li>
                  </ul>

                  <h3 style={{ color: 'var(--text-main)', fontSize: '1.5rem', marginTop: '32px', marginBottom: '16px' }}>5. Automatic Safety Features</h3>
